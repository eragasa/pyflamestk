[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflamestk"
version = "0.1.0"
description = "FLAMES toolkit for materials simulation research"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [
    { name = "Eugene J. Ragasa", email = "eragasa@ufl.edu" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dakota = ["PyYAML>=6"]
plot = ["matplotlib>=3.7"]
all = [
    "PyYAML>=6",
    "matplotlib>=3.7",
]
dev = [
    "build>=1.2",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/eragasa/pyflamestk"

[tool.setuptools]
packages = ["pyflamestk"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
